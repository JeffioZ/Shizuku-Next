files:
  # Both paths are relative to the repository, and deliberately have no leading slash: with
  # one, the download writes to that path from the filesystem root instead of from the
  # checkout, so the files land outside the working tree and git has no change to commit.
  - source: manager/src/main/res/values/strings.xml
    translation: manager/src/main/res/values-%android_code%/%original_file_name%

    # This is where the app's languages are decided, for the 35 of the project's target
    # languages that this app carries. Crowdin's targets are regional locales - Japanese is `ja` with the Android
    # code `ja-rJP`, Russian is `ru-BY`, Indonesian's code is the legacy `in-rID`, German is
    # `de-BE` - so Android's own placeholder would write values-ja-rJP and values-de-rBY.
    # Each is named here instead, which is what makes the export land in the folder this app
    # ships. The format is Crowdin's language code: the code the placeholder should produce.
    #
    # Adding a language is two edits here and a pull request merged by hand, because the check
    # that guards this branch refuses any file whose folder does not exist yet: a language
    # should appear in the app because someone decided it should, never because an export
    # brought it along.
    languages_mapping:
      android_code:
        af: af
        ar-EG: ar
        az: az
        cs: cs
        de-BE: de
        el-CY: el
        es-419: es
        fa-AF: fa
        fi: fi
        fil: fil
        fr-LU: fr
        hu: hu
        hy-AM: hy
        id: id
        it-CH: it
        ja: ja
        ka: ka
        ko: ko
        ms-BN: ms
        nl-SR: nl
        # Quoted because a bare `no` is the boolean false to some YAML parsers. Crowdin's own
        # reads it as the language it is - values-no has been written correctly for as long as
        # this mapping has existed - but nothing gains from leaving that to be checked.
        "no": "no"
        pl: pl
        pt-BR: pt-rBR
        ro: ro
        ru-BY: ru
        sl: sl
        sr-Cyrl-ME: sr
        sv-FI: sv
        ta: ta
        th: th
        tr-CY: tr
        uk: uk
        vi: vi
        # These two were not target languages at all until the app's Chinese folders were
        # seeded into them: Crowdin's own Android codes for them happen to be zh-rCN and
        # zh-rTW, the names this app uses, but naming them here keeps every language in one
        # list rather than leaving two to be found by chance.
        zh-CN: zh-rCN
        zh-TW: zh-rTW

    # Every target language the project has that is not mapped above, so that none of them can
    # write a folder this app does not carry.
    #
    # An unmapped target does not arrive without its own name: Crowdin falls back to Android's
    # own placeholder for it, which writes values-bn-rIN, values-es-rES, values-hi-rIN and so on
    # - folders the app has never heard of. The check that guards the translation pull requests
    # refuses those, which is the point of it, but the refusal is a nightly red run and a pull
    # request nobody can merge rather than a signal anybody reads. So they are held back here
    # instead: their translations stay in Crowdin, and the export only ever writes the folders
    # named above.
    #
    # Keeping the list in step with the mapping above and the project's own languages is manual,
    # because there is nothing that compares them: adding a target in Crowdin is otherwise
    # enough to start this happening again. `ru`, `ru-MD` and `tr` are here rather than mapped
    # because the project carries them alongside the regional `ru-BY` and `tr-CY` this app
    # ships, and they are translations of the same language arriving twice.
    excluded_target_languages:
      - bn
      - bn-IN
      - en-IN
      - es-ES
      - es-US
      - hi
      - mr
      - pa-IN
      - ru
      - ru-MD
      - te
      - tr
      - ur-IN

    translate_attributes: 0
    content_segmentation: 0
